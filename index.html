<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020208">
  <meta name="description" content="A rotating particle Christmas tree rendered in the browser.">
  <title>Merry Christmas</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #020208; }
    body { font-family: Georgia, "Times New Roman", serif; }
    canvas { display: block; width: 100%; height: 100%; }
    .message {
      position: fixed;
      left: clamp(22px, 4vw, 64px);
      top: 34%;
      z-index: 2;
      color: rgba(255, 255, 255, .94);
      text-shadow: 0 0 10px rgba(255,255,255,.55), 0 0 24px rgba(255,180,220,.35);
      pointer-events: none;
      user-select: none;
    }
    .message h1 { margin: 0; font-size: clamp(28px, 4.2vw, 62px); font-weight: 400; font-style: italic; }
    .message p { margin: .35em 0 0; font-size: clamp(20px, 2.8vw, 42px); font-style: italic; }
    .controls { position: fixed; right: 16px; bottom: 14px; z-index: 3; display: flex; align-items: center; gap: 10px; }
    .source { color: rgba(255,255,255,.52); font: 12px/1.2 system-ui, sans-serif; text-decoration: none; }
    .source:hover, .source:focus-visible { color: rgba(255,255,255,.9); }
    button {
      width: 36px; height: 36px; border: 1px solid rgba(255,255,255,.18); border-radius: 999px;
      color: rgba(255,255,255,.8); background: rgba(10,10,24,.48); backdrop-filter: blur(8px);
      cursor: pointer; font: 16px/1 system-ui, sans-serif;
    }
    button:hover, button:focus-visible { background: rgba(255,255,255,.12); color: white; outline: none; }
    @media (max-width: 760px) {
      .message { top: 9%; left: 0; width: 100%; text-align: center; }
      .controls { right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); }
      .source { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="旋转的粉白色粒子圣诞树"></canvas>
  <div class="message" aria-hidden="true">
    <h1>Merry Christmas</h1>
    <p>647</p>
  </div>
  <div class="controls">
    <a class="source" href="https://github.com/ZekangLi-Zico/Christmas-Tree" target="_blank" rel="noreferrer">Original Pygame project</a>
    <button id="toggle" type="button" aria-label="暂停动画" title="暂停动画">Ⅱ</button>
  </div>
  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('scene');
      const ctx = canvas.getContext('2d', { alpha: false });
      const toggle = document.getElementById('toggle');
      const TAU = Math.PI * 2;
      const TREE_HEIGHT = 12;
      const CAM_DIST = 13;
      const CAM_HEIGHT = 6;
      const PITCH = -0.25;
      const cosP = Math.cos(PITCH);
      const sinP = Math.sin(PITCH);

      let viewW = 0;
      let viewH = 0;
      let dpr = 1;
      let angle = 0;
      let lastTime = 0;
      let paused = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let points = [];
      let snow = [];
      let stars = [];
      let ground = [];
      let heart = [];

      // Seeded randomness keeps the composition stable across reloads.
      let seed = 0x19c0ffee;
      const random = () => {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      const rand = (min, max) => min + (max - min) * random();
      const randint = (min, max) => Math.floor(rand(min, max + 1));
      const gaussian = () => {
        const u = Math.max(random(), 1e-9);
        const v = Math.max(random(), 1e-9);
        return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
      };

      const rgb = (r, g, b, a = 1) => `rgba(${r|0},${g|0},${b|0},${a})`;

      function makeTree(count) {
        const result = [];
        const spiralCount = Math.floor(count * 0.7);
        for (let i = 0; i < spiralCount; i++) {
          const u = random();
          const h = u ** 1.6;
          const y = TREE_HEIGHT * h + 0.2;
          let radius = (1 - h) ** 1.1 * 3.2;
          radius *= 1 + 0.65 * Math.max(0, Math.sin((h * 5.8 + 0.15) * TAU));
          const theta = u * 9 * TAU + rand(-0.22, 0.22);
          const r = radius * rand(0.85, 1.08);
          const mid = Math.max(0.15, 1 - Math.abs(h - 0.55) * 1.5);
          let g = Math.min(255, 155 + Math.floor(90 * mid) + randint(-15, 20));
          let b = Math.min(255, 185 + Math.floor(70 * mid) + randint(-15, 35));
          if (random() < 0.08) { g = 255 - randint(0, 35); b = 230 + randint(0, 25); }
          result.push({ x: Math.cos(theta) * r, y, z: Math.sin(theta) * r, color: rgb(255, g, b, .86), glow: random() < .13 });
        }
        for (let i = spiralCount; i < count; i++) {
          const h = random() ** 1.9;
          const y = TREE_HEIGHT * h + 0.2 + rand(-0.08, 0.08);
          let radius = (1 - h) ** 1.1 * 4.3;
          radius *= 1 + 0.65 * Math.max(0, Math.sin((h * 5.8 + 0.15) * TAU));
          const r = radius * Math.sqrt(random());
          const theta = random() * TAU;
          result.push({
            x: Math.cos(theta) * r + rand(-0.08, 0.08), y,
            z: Math.sin(theta) * r + rand(-0.08, 0.08),
            color: rgb(255, randint(165, 225), randint(190, 250), .72), glow: false
          });
        }
        return result;
      }

      function makeGround(count) {
        const result = [];
        const rings = [4.6, 6, 7.4, 8.8, 10.2, 11.4];
        for (let i = 0; i < count; i++) {
          const r = rings[randint(0, rings.length - 1)] + gaussian() * 0.3;
          const theta = random() * TAU;
          const c = random() < .15 ? randint(235, 255) : randint(190, 235);
          result.push({ x: Math.cos(theta) * r, y: -0.25, z: Math.sin(theta) * r, color: rgb(c, c, 255, .68), glow: false });
        }
        return result;
      }

      function makeStars(count) {
        const result = [];
        for (let i = 0; i < count; i++) {
          const c = randint(215, 255);
          result.push({ x: rand(-18, 18), y: rand(3, 18), z: rand(-18, 18), color: rgb(c, c, 255, rand(.25, .68)), glow: random() < .08 });
        }
        return result;
      }

      function makeHeart(count) {
        const result = [];
        while (result.length < count) {
          const x = rand(-1.3, 1.3);
          const y = rand(-1.4, 1.4);
          if ((x*x + y*y - 1) ** 3 - x*x * y ** 3 <= 0) {
            const factor = Math.max(.35, 1.15 - .5 * Math.hypot(x, y));
            result.push({
              x: x * .72, y: TREE_HEIGHT + .05 + (y + 1) * .45, z: rand(-.18, .18),
              color: rgb(255, Math.max(120, Math.min(255, 130 * factor + 80)), Math.max(120, Math.min(255, 190 * factor + 70)), .92),
              glow: true
            });
          }
        }
        return result;
      }

      function resetSnow(flake, initial = false) {
        flake.x = rand(0, viewW);
        flake.y = initial ? rand(-80, viewH) : rand(-80, -10);
        flake.r = rand(2.2, 5.5);
        flake.speed = rand(26, 48);
        flake.drift = rand(-8, 8);
        flake.phase = rand(0, TAU);
      }

      function buildScene() {
        seed = 0x19c0ffee;
        const compact = Math.min(viewW, viewH) < 620;
        points = makeTree(compact ? 18000 : 36000);
        ground = makeGround(compact ? 1400 : 2800);
        stars = makeStars(compact ? 600 : 1000);
        heart = makeHeart(compact ? 600 : 900);
        snow = Array.from({ length: compact ? 12 : 18 }, () => ({}));
        snow.forEach(f => resetSnow(f, true));
      }

      function resize() {
        const oldW = viewW;
        const oldH = viewH;
        viewW = window.innerWidth;
        viewH = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        canvas.width = Math.round(viewW * dpr);
        canvas.height = Math.round(viewH * dpr);
        canvas.style.width = `${viewW}px`;
        canvas.style.height = `${viewH}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (!oldW || (oldW < 620) !== (viewW < 620)) buildScene();
        else if (oldH) snow.forEach(f => { f.x *= viewW / oldW; f.y *= viewH / oldH; });
      }

      function project(p, sinA, cosA) {
        const xr = p.x * cosA - p.z * sinA;
        const zr = p.x * sinA + p.z * cosA;
        const yp = p.y * cosP - zr * sinP;
        const depth = p.y * sinP + zr * cosP + CAM_DIST;
        if (depth <= .1) return null;
        const base = Math.min(viewW * .92, viewH * 1.12);
        const scale = (base * .63) / depth;
        return { x: viewW / 2 + xr * scale, y: viewH / 2 - (yp - CAM_HEIGHT) * scale, depth };
      }

      function drawGroup(group, sinA, cosA, baseSize) {
        for (let i = 0; i < group.length; i++) {
          const p = group[i];
          const q = project(p, sinA, cosA);
          if (!q || q.x < -8 || q.x > viewW + 8 || q.y < -8 || q.y > viewH + 8) continue;
          const size = Math.max(.65, baseSize - q.depth * .055);
          ctx.fillStyle = p.color;
          if (p.glow) {
            ctx.shadowColor = p.color;
            ctx.shadowBlur = size * 4;
          }
          ctx.fillRect(q.x - size / 2, q.y - size / 2, size, size);
          if (p.glow) ctx.shadowBlur = 0;
        }
      }

      function drawSnow(dt) {
        ctx.globalCompositeOperation = 'source-over';
        for (const f of snow) {
          f.y += f.speed * dt;
          f.x += (f.drift + Math.sin(f.phase + f.y * .01) * 5) * dt;
          if (f.y > viewH + 30 || f.x < -30 || f.x > viewW + 30) resetSnow(f);
          const glow = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 3.4);
          glow.addColorStop(0, 'rgba(255,255,255,.95)');
          glow.addColorStop(.2, 'rgba(255,255,255,.68)');
          glow.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r * 3.4, 0, TAU);
          ctx.fill();
        }
      }

      function render(time) {
        const dt = Math.min(.05, lastTime ? (time - lastTime) / 1000 : 0);
        lastTime = time;
        if (!paused) angle += dt * .27;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const bg = ctx.createRadialGradient(viewW * .5, viewH * .56, 0, viewW * .5, viewH * .56, Math.max(viewW, viewH) * .72);
        bg.addColorStop(0, '#090817');
        bg.addColorStop(.52, '#03030c');
        bg.addColorStop(1, '#000003');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, viewW, viewH);

        const sinA = Math.sin(angle);
        const cosA = Math.cos(angle);
        ctx.globalCompositeOperation = 'lighter';
        drawGroup(stars, sinA, cosA, 2.2);
        drawGroup(ground, sinA, cosA, 2.35);
        drawGroup(points, sinA, cosA, 2.6);
        drawGroup(heart, sinA, cosA, 2.85);
        drawSnow(paused ? 0 : dt);

        requestAnimationFrame(render);
      }

      function syncButton() {
        toggle.textContent = paused ? '▶' : 'Ⅱ';
        toggle.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
        toggle.title = paused ? '播放动画' : '暂停动画';
      }

      toggle.addEventListener('click', () => { paused = !paused; syncButton(); });
      window.addEventListener('resize', resize, { passive: true });
      resize();
      syncButton();
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
